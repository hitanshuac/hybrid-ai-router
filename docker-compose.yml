# ============================================================
# Hybrid AI Router — Self-Hosted Docker Compose (Track B)
# ============================================================
# Use this to run the router backend locally or on a cloud VPS.
# For HF Spaces, push the repo directly — no docker-compose needed.
#
# Deploy: docker-compose up -d
# Verify: curl http://localhost:8000/health
#

services:
  # ============================================================
  # SERVICE A: FastAPI 9-Tier Router (Python 3.11)
  # ============================================================
  hybrid-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hybrid-ai-router
    restart: always
    ports:
      - "8000:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=7860
    env_file:
      - .env
    volumes:
      - ./secrets:/home/appuser/app/secrets:ro
      - router-data:/home/appuser/app/data
    networks:
      - ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  ai-network:
    driver: bridge

volumes:
  router-data:
    driver: local
